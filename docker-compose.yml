services:
  app:
    build: .
    image: listing-ai:local
    container_name: listing-ai-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/listing_ai
      DATABASE_USERNAME: listing_ai
      DATABASE_PASSWORD: change-me
      STORAGE_ENDPOINT: http://s3mock:9090
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-preview-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-preview-secret}
      INITIAL_FREE_CREDITS: ${INITIAL_FREE_CREDITS:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_TEXT: ${AI_MODEL_TEXT:-gemini-3.5-flash-lite}
      AI_LISTING_DAILY_LIMIT: ${AI_LISTING_DAILY_LIMIT:-5}
      AI_TEXT_INPUT_USD_PER_MILLION: ${AI_TEXT_INPUT_USD_PER_MILLION:-0.30}
      AI_TEXT_OUTPUT_USD_PER_MILLION: ${AI_TEXT_OUTPUT_USD_PER_MILLION:-2.50}
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started

  postgres:
    image: postgres:17
    container_name: listing-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: listing_ai
      POSTGRES_USER: listing_ai
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listing_ai -d listing_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:5.2.3
    container_name: listing-ai-s3mock
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: listing-ai
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock_data:/s3mockroot

volumes:
  postgres_data:
  s3mock_data:
